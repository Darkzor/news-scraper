[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-scraper-backend"
version = "0.1.0"
description = "FastAPI backend for the News Scraper project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "playwright>=1.44,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_scraper_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
